onboarding = false

[ui]
status_indicators = "symbols"
# Scroll farther with each mouse-wheel notch.
mouse_scroll_lines = 16

[terminal]
# New tabs use the launcher below: Codex by default, or $SHELL when the
# terminal-tab shortcut marks the new tab explicitly.
default_shell = "/workspace/.dotfiles/herdr/bin/herdr-tab-shell"
# Allow Codex pet images to render through Herdr.
kitty_graphics = true

[worktrees]
directory = "/workspace/.herdr/worktrees"

[theme]
name = "tokyo-night"
auto_switch = false

[keys]
prefix = "ctrl+a"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+k"
# Create a new Codex tab with Ctrl+A, then C.
new_tab = "prefix+c"
previous_tab = "shift+alt+h"
next_tab = "shift+alt+l"
previous_workspace = "shift+alt+k"
next_workspace = "shift+alt+j"
navigate_workspace_down = "shift+alt+j"
navigate_workspace_up = "shift+alt+k"

# Create a new terminal tab with Ctrl+A, then Shift+C.
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "herdr tab create --focus --env HERDR_TAB_SHELL=terminal"
